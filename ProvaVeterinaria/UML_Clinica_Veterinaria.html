<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"/>
<title>UML Clínica Veterinária</title>
<style>
  body { margin: 0; background: #1a1a2e; display: flex; justify-content: center; padding: 20px; font-family: sans-serif; }
  svg { max-width: 900px; width: 100%; }
  .lbl  { font-size: 11px; fill: #e0e0e0; }
  .title{ font-size: 13px; fill: #ffffff; font-weight: bold; }
  .sub  { font-size: 10px; fill: #aaaaaa; }
  .note { font-size: 10px; fill: #888888; }
</style>
</head>
<body>
<svg viewBox="0 0 880 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9Z" fill="#1a1a2e" stroke="#aaa" stroke-width="1.2"/>
    </marker>
    <marker id="dia" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="10" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 5L7 1L13 5L7 9Z" fill="#1a1a2e" stroke="#aaa" stroke-width="1"/>
    </marker>
  </defs>

  <text class="title" x="440" y="22" text-anchor="middle">Clínica Veterinária — Diagrama de Classes</text>

  <!-- Tutor -->
  <rect x="20" y="36" width="120" height="52" rx="6" fill="#2d2d4e" stroke="#6c8ebf" stroke-width="1"/>
  <text class="lbl" x="80" y="54" text-anchor="middle" font-weight="bold">Tutor</text>
  <line x1="20" y1="60" x2="140" y2="60" stroke="#6c8ebf" stroke-width="0.5"/>
  <text class="sub" x="80" y="72" text-anchor="middle">nome: String</text>
  <text class="sub" x="80" y="83" text-anchor="middle">telefone: String</text>

  <!-- Animal (contém referência ao Tutor) -->
  <rect x="160" y="28" width="140" height="66" rx="6" fill="#2d2d4e" stroke="#6c8ebf" stroke-width="1"/>
  <text class="lbl" x="230" y="46" text-anchor="middle" font-weight="bold">Animal</text>
  <line x1="160" y1="52" x2="300" y2="52" stroke="#6c8ebf" stroke-width="0.5"/>
  <text class="sub" x="230" y="64" text-anchor="middle">nome: String</text>
  <text class="sub" x="230" y="75" text-anchor="middle">especie: String</text>
  <text class="sub" x="230" y="86" text-anchor="middle">adotado: boolean</text>

  <!-- Atendimento -->
  <rect x="320" y="28" width="200" height="54" rx="6" fill="#16213e" stroke="#82b0ff" stroke-width="1.5"/>
  <text class="lbl" x="420" y="46" text-anchor="middle" fill="#82b0ff" font-weight="bold">Atendimento</text>
  <line x1="320" y1="52" x2="520" y2="52" stroke="#82b0ff" stroke-width="0.5" stroke-opacity="0.4"/>
  <text class="sub" x="420" y="64" text-anchor="middle">animal: Animal</text>
  <text class="sub" x="420" y="75" text-anchor="middle">getTutor() → animal.getTutor()</text>

  <!-- Tutor ——► Animal (composição / posse) -->
  <line x1="140" y1="55" x2="160" y2="55" stroke="#aaa" stroke-width="1" marker-end="url(#arr)"/>
  <text class="note" x="150" y="50" text-anchor="middle">tutor</text>

  <!-- Animal ——► Atendimento -->
  <line x1="300" y1="55" x2="320" y2="55" stroke="#aaa" stroke-width="1" marker-end="url(#arr)"/>

  <line x1="20" y1="90" x2="860" y2="90" stroke="#444" stroke-width="0.5" stroke-dasharray="4 3"/>

  <text class="title" x="120" y="108" text-anchor="middle" fill="#d6b656">State</text>

  <rect x="20" y="118" width="200" height="38" rx="6" fill="#2d2d2e" stroke="#9b59b6" stroke-width="1"/>
  <text class="sub" x="120" y="132" text-anchor="middle" fill="#9b59b6">«interface»</text>
  <text class="lbl" x="120" y="148" text-anchor="middle" fill="#9b59b6" font-weight="bold">SituacaoAtendimento</text>

  <rect x="20"  y="178" width="88" height="26" rx="5" fill="#1e3a1e" stroke="#82b366" stroke-width="1"/>
  <text class="lbl" x="64" y="195" text-anchor="middle">Agendado</text>

  <rect x="116" y="178" width="104" height="26" rx="5" fill="#3a3a1e" stroke="#d6b656" stroke-width="1"/>
  <text class="lbl" x="168" y="195" text-anchor="middle">EmAtendimento</text>

  <rect x="20"  y="212" width="88" height="26" rx="5" fill="#1e2a3a" stroke="#6c8ebf" stroke-width="1"/>
  <text class="lbl" x="64" y="229" text-anchor="middle">Finalizado</text>

  <rect x="116" y="212" width="104" height="26" rx="5" fill="#3a1e1e" stroke="#b85450" stroke-width="1"/>
  <text class="lbl" x="168" y="229" text-anchor="middle">Cancelado</text>

  <line x1="64"  y1="178" x2="86"  y2="156" stroke="#aaa" stroke-width="0.8" stroke-dasharray="5 3" marker-end="url(#tri)"/>
  <line x1="168" y1="178" x2="148" y2="156" stroke="#aaa" stroke-width="0.8" stroke-dasharray="5 3" marker-end="url(#tri)"/>
  <line x1="64"  y1="212" x2="86"  y2="156" stroke="#aaa" stroke-width="0.8" stroke-dasharray="5 3" marker-end="url(#tri)"/>
  <line x1="168" y1="212" x2="148" y2="156" stroke="#aaa" stroke-width="0.8" stroke-dasharray="5 3" marker-end="url(#tri)"/>

  <!-- Atendimento —► SituacaoAtendimento (state) -->
  <path d="M370 82 L120 82 L120 118" fill="none" stroke="#82b0ff" stroke-width="0.8" marker-end="url(#arr)"/>
  <text class="note" x="245" y="77" text-anchor="middle">state</text>

  <text class="note" x="120" y="256">Agendado → EmAtendimento → Finalizado</text>
  <text class="note" x="120" y="270">Agendado → Cancelado</text>

  <line x1="240" y1="90" x2="240" y2="510" stroke="#444" stroke-width="0.5" stroke-dasharray="4 3"/>

  <text class="title" x="120" y="300" text-anchor="middle" fill="#d6b656">Observer</text>

  <rect x="20" y="312" width="200" height="38" rx="6" fill="#2d2d2e" stroke="#9b59b6" stroke-width="1"/>
  <text class="sub" x="120" y="326" text-anchor="middle" fill="#9b59b6">«interface»</text>
  <text class="lbl" x="120" y="342" text-anchor="middle" fill="#9b59b6" font-weight="bold">ObservadorAtendimento</text>

  <rect x="20"  y="372" width="140" height="26" rx="5" fill="#3a1e1e" stroke="#b85450" stroke-width="1"/>
  <text class="lbl" x="90" y="389" text-anchor="middle">TutorObservador</text>

  <rect x="20"  y="406" width="160" height="26" rx="5" fill="#3a1e1e" stroke="#b85450" stroke-width="1"/>
  <text class="lbl" x="100" y="423" text-anchor="middle">VeterinarioObservador</text>

  <rect x="20"  y="440" width="150" height="26" rx="5" fill="#3a1e1e" stroke="#b85450" stroke-width="1"/>
  <text class="lbl" x="95" y="457" text-anchor="middle">RecepcaoObservador</text>

  <line x1="90"  y1="372" x2="100" y2="350" stroke="#aaa" stroke-width="0.8" stroke-dasharray="5 3" marker-end="url(#tri)"/>
  <line x1="100" y1="406" x2="110" y2="350" stroke="#aaa" stroke-width="0.8" stroke-dasharray="5 3" marker-end="url(#tri)"/>
  <line x1="95"  y1="440" x2="118" y2="350" stroke="#aaa" stroke-width="0.8" stroke-dasharray="5 3" marker-end="url(#tri)"/>

  <!-- Atendimento —► ObservadorAtendimento (notifica) -->
  <path d="M370 82 L220 82 L220 330" fill="none" stroke="#aaa" stroke-width="0.8" stroke-dasharray="3 2" marker-end="url(#arr)"/>
  <text class="note" x="240" y="315" text-anchor="middle">notifica</text>
  <text class="note" x="240" y="327" text-anchor="middle">1..*</text>

  <text class="title" x="580" y="108" text-anchor="middle" fill="#d6b656">Decorator</text>

  <rect x="360" y="118" width="220" height="38" rx="6" fill="#2d2d2e" stroke="#9b59b6" stroke-width="1"/>
  <text class="sub" x="470" y="132" text-anchor="middle" fill="#9b59b6">«interface»</text>
  <text class="lbl" x="470" y="148" text-anchor="middle" fill="#9b59b6" font-weight="bold">ServicoVeterinario</text>

  <rect x="360" y="182" width="100" height="38" rx="6" fill="#1e3a2e" stroke="#82b366" stroke-width="1"/>
  <text class="lbl" x="410" y="196" text-anchor="middle" fill="#82b366">ServicoBase</text>
  <text class="sub" x="410" y="212" text-anchor="middle">Component</text>

  <rect x="478" y="182" width="120" height="38" rx="6" fill="#3a3a1e" stroke="#d6b656" stroke-width="1"/>
  <text class="sub" x="538" y="196" text-anchor="middle" fill="#d6b656">«abstract»</text>
  <text class="lbl" x="538" y="212" text-anchor="middle" fill="#d6b656" font-style="italic">ServicoDecorator</text>

  <line x1="410" y1="182" x2="430" y2="156" stroke="#aaa" stroke-width="0.8" stroke-dasharray="5 3" marker-end="url(#tri)"/>
  <line x1="538" y1="182" x2="510" y2="156" stroke="#aaa" stroke-width="0.8" stroke-dasharray="5 3" marker-end="url(#tri)"/>

  <rect x="370" y="248" width="150" height="26" rx="5" fill="#3a1e1e" stroke="#b85450" stroke-width="1"/>
  <text class="lbl" x="445" y="265" text-anchor="middle">DescontoAdotado (−10%)</text>

  <rect x="370" y="282" width="150" height="26" rx="5" fill="#3a1e1e" stroke="#b85450" stroke-width="1"/>
  <text class="lbl" x="445" y="299" text-anchor="middle">TaxaDomiciliar (+R$50)</text>

  <rect x="370" y="316" width="160" height="26" rx="5" fill="#3a1e1e" stroke="#b85450" stroke-width="1"/>
  <text class="lbl" x="450" y="333" text-anchor="middle">BanhoPosConsulta (+R$80)</text>

  <line x1="445" y1="248" x2="510" y2="220" stroke="#aaa" stroke-width="0.8" marker-end="url(#tri)"/>
  <line x1="445" y1="282" x2="510" y2="220" stroke="#aaa" stroke-width="0.8" marker-end="url(#tri)"/>
  <line x1="450" y1="316" x2="510" y2="220" stroke="#aaa" stroke-width="0.8" marker-end="url(#tri)"/>

  <path d="M598 182 L640 154 L640 137 L580 137" fill="none" stroke="#aaa" stroke-width="0.8" marker-start="url(#dia)" marker-end="url(#arr)"/>
  <text class="note" x="648" y="158">servico</text>

  <!-- Atendimento —► ServicoVeterinario -->
  <line x1="520" y1="55" x2="540" y2="55" stroke="#82b0ff" stroke-width="0.8"/>
  <line x1="540" y1="55" x2="540" y2="118" stroke="#82b0ff" stroke-width="0.8" marker-end="url(#arr)"/>
  <text class="note" x="560" y="88" text-anchor="middle">servico</text>

  <line x1="20" y1="520" x2="860" y2="520" stroke="#444" stroke-width="0.5"/>

  <rect x="20"  y="534" width="12" height="12" rx="2" fill="#9b59b6"/>
  <text class="note" x="38" y="544">Interface</text>
  <rect x="130" y="534" width="12" height="12" rx="2" fill="#1e3a2e" stroke="#82b366" stroke-width="1"/>
  <text class="note" x="148" y="544">ConcreteComponent (Serviço Base)</text>
  <rect x="330" y="534" width="12" height="12" rx="2" fill="#3a3a1e" stroke="#d6b656" stroke-width="1"/>
  <text class="note" x="348" y="544">Abstract Decorator</text>
  <rect x="490" y="534" width="12" height="12" rx="2" fill="#3a1e1e" stroke="#b85450" stroke-width="1"/>
  <text class="note" x="508" y="544">Concrete Observer / Decorator / State</text>
  <rect x="20"  y="558" width="12" height="12" rx="2" fill="#16213e" stroke="#82b0ff" stroke-width="1.5"/>
  <text class="note" x="38" y="568">Atendimento (contexto central)</text>

  <text class="note" x="440" y="590" text-anchor="middle">— — ▷ implements   ——▷ extends   ——► associação   ◇—— agrega</text>
  <text class="note" x="440" y="608" text-anchor="middle">State + Observer integrados em Atendimento · Decorator em ServicoVeterinario</text>
</svg>
</body>
</html>
